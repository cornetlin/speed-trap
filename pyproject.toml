[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-trap"
version = "0.1.0"
description = "Interval speed measurement edge station for Raspberry Pi 5 + Hailo AI HAT+"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lin Shu-Hsien" }]
# 必要依賴。要跟 requirements.txt 保持一致 —— pip install -e . 與
# pip install -r requirements.txt 必須裝出相同的環境。
# PyGObject(gi)與 hailo 不在此列:兩者走 apt,不走 pip,理由見 requirements.txt。
dependencies = [
    "paho-mqtt",
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "fast-plate-ocr",
    "ultralytics",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]
# 可選的 OCR 後端。PaddleOCR 約 150 MB,只有 config 設 ocr_backend: paddleocr
# 時才需要,不列為必要依賴。啟用方式見 README。
paddle = [
    "paddleocr",
    "paddlepaddle",   # PaddleOCR 的推論後端,兩個都要才跑得起來
]

[tool.setuptools.packages.find]
where = ["."]
include = ["speed_trap*"]
exclude = ["tests*", "apps*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
