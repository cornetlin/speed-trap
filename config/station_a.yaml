station_id: station_a
camera_source: /dev/video0
# 相機實際擷取解析度與張數。車輛偵測會另外縮到 hailo_input_size 餵 Hailo,
# 但裁切車輛區域是在這個原始解析度上做的 —— 車牌的像素數由這裡決定。
frame_width: 1920
frame_height: 1080
frame_fps: 30
# HEF 編譯時固定的輸入邊長(正方形)。換模型才需要動,不是相機解析度。
hailo_input_size: 640
# Hailo-8 / Hailo-8L 預設(Pi 5 + AI HAT+,hailo-models / hailo-tappas-core apt 套件提供)
# 用 _h8 後綴對應 Hailo-8 晶片(AI HAT+ 26 TOPS),用 _h8l 對應 Hailo-8L(13 TOPS)。
# 跑錯版本仍能執行但 HailoRT 會發 warning + 效能下降。`hailortcli scan` 看晶片型號。
# 換不同 HEF 時 hailofilter_so_path 不用改(libyolo_hailortpp_post.so 通用 v6/v8)
hef_path: /usr/share/hailo-models/yolov6n_h8.hef
hailofilter_so_path: /usr/lib/aarch64-linux-gnu/hailo/tappas/post_processes/libyolo_hailortpp_post.so
vehicle_classes:
  - car
  - truck
  - bus
  - motorcycle
trigger_line_y: 0.7
mqtt_broker: null
mqtt_topic: speedtrap/station_a/passage
log_level: INFO

# === Phase A — Plate OCR experiments ===
# 切換 OCR backend / 模型 / 前處理,不用改 code,改 YAML 即可
#
# ocr_backend:
#   "fast-plate-ocr"  → 預設,輕量 ONNX 模型(~10 MB),Pi CPU 10-30 ms
#   "paddleocr"       → PaddleOCR(~150 MB),中文系強;需 pip install paddleocr
#   "noop"            → 完全關閉 OCR(只跑車輛偵測,passage 事件無 plate_text)
#
# ocr_model_name (僅 fast-plate-ocr 有效;PaddleOCR 用 ocr_backend 切):
#   hub 模型(自動下載):
#     "global-plates-mobile-vit-v2-model"   → 全球(預設,對台灣弱 ~10%)
#     "european-plates-mobile-vit-v2-model" → 歐洲(字符集相近)
#     "cct-xs-v1-global-model"              → 新版 CCT 架構
#   自訓 ONNX(W3+ Phase B v2 學生訓練產出):
#     "/home/kevin30/speed-trap/models/taiwan_ocr.onnx"
#     ↑ 絕對路徑,搭配下方 ocr_model_config 指向對應的 plate_config.yaml
#
# ocr_model_config: 自訓 ONNX 時必填,指向 plate_config.yaml(訓練輸出有);
#                   hub 模型留 null 即可
#
# ocr_plate_detector_path: W3 v2 cascade — W2 訓的車牌偵測模型 (.pt or .onnx)
#   設定後系統會先在 Hailo 切出的車輛 crop 內找車牌 bbox,再 crop 餵 OCR。
#   不設則直接把整輛車 crop 丟給 OCR(經驗上會讀很糟)。
#   例: /home/kevin30/speed-trap/models/plate_detector.pt
#
# ocr_preprocess: true 會在 OCR 前做 CLAHE 對比增強 + unsharp,可能救回低對比車牌
#
# save_debug_crops: false 把每次的 vehicle/plate/preproc crop 存到
#   ~/speedtrap_debug/00001_vehicle.jpg 等(SD 卡上,重開機不會消失),
#   供事後檢查 cascade 每階段是否切對。Production 應為 false。
# =====================================================================
# 最佳幀挑選 —— 現場調參數區。改這裡就好,不用動程式。
# =====================================================================
# edge_margin: 正規化 bbox 任一邊落在畫面邊緣這個距離內,該幀直接排除,
#   不列入最佳幀候選(車頭出框 = 車牌被裁掉一半)。0.02 = 畫面的 2%。
#   調大更嚴格、可用幀變少;幀率低時排太嚴會沒幀可用(有保護機制,見下)。
edge_margin: 0.02
# 三項評分權重。面積權重過高會偏好「車子最大」也就是快出框的那一幀,
# 這是先前選錯幀的主因。想更保守就把 area 調降、center 調升。
score_area_weight: 0.6
score_center_weight: 0.3
score_sharpness_weight: 0.1
# 清晰度(Laplacian 變異數)正規化的參考值。實測畫面普遍偏糊就調小,
# 普遍銳利就調大。看 CSV 的 chosen_sharpness 欄位來抓。
sharpness_reference: 500.0
# 一個 track 多久沒再出現就視為車子已離開畫面 —— 結算時機與每台車幀數
# 統計都用這個值。
track_idle_timeout_s: 2.0
# 少於這麼多幀的 track 視為雜訊(晃動誤判、遠處一閃而過),不產生事件。
min_track_frames: 2
# 車輛裁切圖的 JPEG 品質。
jpeg_quality: 85

# === 重複計數防治 ===
# hailotracker 的 keep-tracked-frames / keep-new-frames。太小的話車子被
# 短暫遮住就斷開重編號,同一台車會被算成兩台。
tracker_keep_frames: 10
# 這段秒數內讀到相同車牌字串視為重複事件,只寫進 CSV 不送出。0 = 關閉。
duplicate_window_s: 10.0

# === 診斷輸出 ===
# 每台車一行的詳細 CSV,以及最佳幀裁切圖(成功失敗都存)。
# 兩者都設空字串即可關閉。
passage_csv_path: ~/speedtrap_events.csv
passage_crop_dir: ~/speedtrap_crops

ocr_backend: fast-plate-ocr
ocr_model_name: /home/kevin30/speed-trap/models/best.onnx
ocr_model_config: /home/kevin30/speed-trap/models/plate_config.yaml
ocr_plate_detector_path: /home/kevin30/speed-trap/models/plate_detector.pt
ocr_preprocess: false
save_debug_crops: true
